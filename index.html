<!doctype html>
<html lang="vi"><head><meta charset="utf-8">

<style>
:root{--bg:#0d0f12;--c:#171a1f;--a:#3ddc97;--t:#eee;--m:#9aa3ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,sans-serif;padding-bottom:76px}
main{padding:14px;padding-top:calc(14px + env(safe-area-inset-top));max-width:640px;margin:auto}
h2{margin:0 0 10px;font-size:20px}h3{margin:0 0 6px;font-size:15px;color:var(--a)}
.card{background:var(--c);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
input,select,textarea,button{font:inherit;color:var(--t);background:#22262d;border:1px solid #333;border-radius:8px;padding:9px;width:100%}
button{background:var(--a);color:#000;font-weight:700;border:0;margin-top:6px}button.g{background:#22262d;color:var(--t);border:1px solid #444}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#12151a;border-top:1px solid #262a31;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--m);border-radius:0;padding:12px 2px;font-size:12px;margin:0;border:0}nav button.on{color:var(--a)}
.big{font-size:26px;font-weight:800}.mut{color:var(--m);font-size:13px}.warn{color:#ffd166;font-size:13px}
table{width:100%;border-collapse:collapse}td{padding:5px 2px;border-bottom:1px solid #262a31;vertical-align:top}
canvas{width:100%;border-radius:10px;background:#000}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9;overflow:auto;padding:14px}.mo .box{max-width:640px;margin:0 auto}
.dm{width:100%;height:260px;border-radius:12px;display:block;touch-action:none}.ex{cursor:pointer;border-bottom:1px dotted var(--a)}
#auth{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:14px;padding-top:calc(14px + env(safe-area-inset-top))}#auth .box{max-width:420px;margin:12vh auto 0}
</style></head><body>
<main id="v"></main>
<nav><button data-t="profile">Hồ sơ</button><button data-t="plan">Kế hoạch</button><button data-t="food">Ăn uống</button><button data-t="cam">Form AI</button><button data-t="log">Nhật ký</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $ = s => document.querySelector(s), V = $('#v');
// ---- Tài khoản và đồng bộ (Firebase, gói Spark miễn phí, không hết hạn). Dán firebaseConfig vào FB_CONFIG; để null = chế độ lưu trên máy này ----
const FB_CONFIG =  apiKey: "AIzaSyAJ9Ma7jtcyCvrEnf87R0uzdOlXt7zuel0",
  authDomain: "gym-coach-nvanbao.firebaseapp.com",
  projectId: "gym-coach-nvanbao",
  storageBucket: "gym-coach-nvanbao.firebasestorage.app",
  messagingSenderId: "137992564099",
  appId: "1:137992564099:web:35eab8fa88c0181e985ab6" ; // ví dụ: { apiKey: '...', authDomain: 'ten-du-an.firebaseapp.com', projectId: 'ten-du-an', appId: '...' }
let KEY = 'gym', USER = null, DB = null, AUTH = null, dirty = false, canPush = false, st8 = '', svT, LASTEM = '', rev = 0;
const norm = d => { d = d && typeof d == 'object' ? d : {}; d.p = d.p || null; d.w = d.w || []; d.s = d.s || []; d.c = d.c || []; d.adj = d.adj || 0; d.ref = d.ref || {}; return d; };
let D = {}; try { D = JSON.parse(localStorage.gym || '{}'); } catch (e) {}
D = norm(D);
const sync = m => { st8 = m; const e = $('#sync'); if (e) e.textContent = m; };
const uref = () => DB.collection('users').doc(USER.uid);
// Chọn bản dữ liệu khi đăng nhập: cloud = {json, ts} | null; st = {dirty: có sửa chưa đồng bộ, lastSync: mốc đồng bộ gần nhất}
function pickData(cloud, loc, st) {
  if (!cloud) return { src: loc ? 'local' : 'none' };
  if (loc && st.dirty && cloud.ts <= st.lastSync) return { src: 'local' };      // sửa lúc offline, máy chủ chưa đổi: giữ bản trên máy rồi đẩy lên
  return { src: 'cloud', conflict: !!(loc && st.dirty) };                        // máy chủ mới hơn: lấy bản máy chủ, bản sửa offline được giữ dự phòng
}
async function push() {
  if (!DB || !USER || !dirty || !canPush) return; sync('Đang đồng bộ…');
  const ts = Date.now(), r = rev;
  try {
    await uref().set({ json: JSON.stringify(D), updated_at: ts });
    localStorage[KEY + '_s'] = ts;
    if (r == rev) { dirty = false; localStorage.removeItem(KEY + '_d'); sync('Đã đồng bộ'); } else { clearTimeout(svT); svT = setTimeout(push, 300); }
  } catch (e) { sync('Chưa đồng bộ được, sẽ thử lại khi có mạng'); }
}
const save = () => { rev++; try { localStorage[KEY] = JSON.stringify(D); if (DB && USER) localStorage[KEY + '_d'] = '1'; } catch (e) {} if (DB && USER) { dirty = true; clearTimeout(svT); svT = setTimeout(push, 800); } };
async function reconnect() { // đang dùng offline, có mạng lại: chỉ đẩy lên khi máy chủ chưa bị đổi từ lần đồng bộ cuối
  if (!DB || !USER || canPush) return;
  try {
    const doc = await uref().get(), ts = doc.exists ? (doc.data().updated_at || 0) : 0;
    if (ts <= (+localStorage[KEY + '_s'] || 0)) { canPush = true; dirty = true; push(); } else sync('Máy chủ có dữ liệu mới hơn, hãy đăng xuất rồi đăng nhập lại để tải về');
  } catch (e) {}
}
addEventListener('online', () => { push(); reconnect(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(svT); push(); } });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
const today = () => new Date().toISOString().slice(0, 10);
// Hệ số vận động NGOÀI giờ tập theo công việc (đã tách riêng buổi tập)
const JOBS = [['Văn phòng / kế toán / lập trình (ngồi nhiều)', 1.30], ['Sinh viên (học, ít di chuyển)', 1.35], ['Tài xế (ngồi lái)', 1.35],
  ['Giáo viên / giảng viên (đứng, đi lại vừa)', 1.45], ['Bán hàng / phục vụ (đứng nhiều)', 1.55], ['Y tá / đầu bếp / chăm sóc', 1.55],
  ['Shipper / giao hàng', 1.60], ['Công nhân nhà máy / thợ', 1.65], ['Lao động nặng (xây dựng, bốc vác, nông nghiệp)', 1.80], ['Học sinh (đi học, ít vận động)', 1.40]];
const GOALS = { gain: 'Tăng cơ', lean: 'Săn chắc (giảm mỡ, giữ/tăng cơ)', cut: 'Giảm mỡ', keep: 'Giữ cân' };

function calc(p) {
  const bmr = p.fat ? 370 + 21.6 * p.w * (1 - p.fat / 100) : 10 * p.w + 6.25 * p.h - 5 * p.age + (p.sex == 'm' ? 5 : -161);
  const pal = JOBS[p.job][1], tdee = bmr * pal + p.n * 4.5 * p.w / 7; // buổi tập ≈ MET 4.5 × 1 giờ
  let f = { gain: 1.1, lean: .95, cut: .82, keep: 1 }[p.goal], note = '';
  if (p.age < 18 && f < 1) f = 1;
  let t = tdee * f + D.adj;
  const fl = Math.max(p.sex == 'm' ? 1500 : 1200, bmr * .9);
  if (t < fl) { t = fl; note = 'Đã nâng lên mức calo tối thiểu an toàn.'; }
  if (p.goal == 'gain' && t > tdee + 500) t = tdee + 500;
  const pro = p.w * { gain: 1.8, lean: 2, cut: 2.2, keep: 1.6 }[p.goal], fat = p.w * .9;
  return { bmr, pal, tdee, t, pro, fat, carb: Math.max(0, (t - pro * 4 - fat * 9) / 4), water: p.w * .035 + .5, note };
}
function trend() {
  const a = D.w.filter(x => x.d >= (D.adjAt || '') && Date.now() - new Date(x.d) < 21 * 864e5);
  if (a.length < 2) return null;
  const f = a[0], l = a[a.length - 1], days = (new Date(l.d) - new Date(f.d)) / 864e5;
  if (days < 6) return null;
  const r = (l.kg - f.kg) / f.kg * 100 / (days / 7), g = D.p.goal; let d = 0;
  if (g == 'cut') d = r > -.3 ? -100 : r < -1 ? 150 : 0;
  else if (g == 'gain') d = r < .1 ? 150 : r > .6 ? -100 : 0;
  else if (g == 'lean') d = r > .15 ? -100 : r < -.5 ? 100 : 0;
  else d = r > .3 ? -100 : r < -.3 ? 100 : 0;
  return { r, d };
}
function go(t) {
  if (DB && !USER) return showLogin();
  stopCam(); closeDemo(); clearInterval(tm);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t == t));
  if (!D.p && t != 'profile') t = 'profile';
  T[t](); window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.t));

// ---------------- Hồ sơ ----------------
const T = {};
T.profile = () => {
  const p = Object.assign({ bud: 'mid', cap: '' }, D.p || { sex: 'm', age: 21, h: 170, w: 65, fat: '', job: 0, n: 4, exp: 0, eq: 'gym', goal: 'lean', allergy: '', injury: '', time: '18:00' });
  V.innerHTML = `${acctBar()}${backupBar()}<h2>Hồ sơ của bạn</h2><div class=card>
  <div class=r2><div><label>Giới tính</label><select id=sex><option value=m>Nam<option value=f>Nữ</select></div>
  <div><label>Tuổi</label><input id=age type=number></div>
  <div><label>Chiều cao (cm)</label><input id=h type=number></div><div><label>Cân nặng (kg)</label><input id=w type=number step=.1></div></div>
  <label>% mỡ cơ thể (không bắt buộc, giúp tính chính xác hơn)</label><input id=fat type=number>
  <label>Công việc (ước lượng vận động ngoài giờ tập)</label><select id=job>${JOBS.map((j, i) => `<option value=${i}>${j[0]}`).join('')}</select>
  <label>Mục tiêu</label><select id=goal>${Object.entries(GOALS).map(([k, v]) => `<option value=${k}>${v}`).join('')}</select>
  <div class=r2><div><label>Số buổi tập / tuần</label><select id=n><option>3<option>4<option>5<option>6</select></div>
  <div><label>Kinh nghiệm</label><select id=exp><option value=0>Mới tập<option value=1>Trung bình<option value=2>Lâu năm</select></div>
  <div><label>Nơi tập</label><select id=eq><option value=gym>Phòng gym<option value=home>Tại nhà</select></div>
  <div><label>Giờ tập thường ngày</label><input id=time type=time></div></div>
  <label>Ngân sách đầu tư cho tập luyện và ăn uống</label><select id=bud><option value=sv>Học sinh / sinh viên (tiết kiệm)<option value=mid>Cơ bản (cân bằng)<option value=inv>Đầu tư nghiêm túc (người đi làm, chi nhiều hơn)</select>
  <label>Ngân sách ăn uống mỗi ngày (nghìn đồng, tùy chọn)</label><input id=cap type=number placeholder="vd: 60">
  <label>Dị ứng / món không ăn (cách nhau bằng dấu phẩy)</label><input id=allergy placeholder="vd: tôm, đậu phộng, sữa">
  <label>Chấn thương / vấn đề sức khỏe</label><input id=injury placeholder="vd: đau gối phải">
  <button onclick="saveP()">Lưu và tạo kế hoạch</button></div>
  <p class=mut>Ứng dụng chỉ mang tính hỗ trợ, không thay thế huấn luyện viên hoặc bác sĩ. Nếu có chấn thương hay bệnh lý, hãy hỏi chuyên gia trước khi tập. Video camera chỉ xử lý trên máy bạn, không gửi đi đâu.</p>`;
  Object.keys(p).forEach(k => { const e = $('#' + k); if (e) e.value = p[k] || (k == 'job' || k == 'exp' ? 0 : ''); });
};
function saveP() {
  const g = i => $('#' + i).value;
  const p = { sex: g('sex'), age: +g('age'), h: +g('h'), w: +g('w'), fat: +g('fat') || 0, job: +g('job'), n: +g('n'), exp: +g('exp'), eq: g('eq'), goal: g('goal'), allergy: g('allergy'), injury: g('injury'), time: g('time') || '18:00', bud: g('bud') || 'mid', cap: +g('cap') || 0 };
  if (!(p.age >= 14 && p.age <= 80 && p.h >= 120 && p.h <= 230 && p.w >= 35 && p.w <= 200)) { alert('Kiểm tra lại tuổi, chiều cao, cân nặng.'); return; }
  D.p = p; if (!D.start) D.start = today(); if (!D.w.length) D.w.push({ d: today(), kg: p.w }); save(); go('plan');
}

// ---------------- Kế hoạch tập ----------------
const ABS = [['Gập cơ bụng đẩy tạ cao', 'Crunch', 'a', '', '3x12'], ['Gập cơ bụng kiểu nga', 'Gập cơ bụng kiểu nga', 'a', '', '3x20/10'], ['Dumbbell side bend', 'Nghiêng người tạ đơn (side bend)', 'a', '', '4x12'], ['Nâng xà gập bụng', 'Nâng chân nằm (leg raise)', 'a', '', '4x12']];
const CARDIO = ['Cardio: đi bộ leo dốc', 'Cardio: đi bộ nhanh', 'a', '', '15–20 phút'];
// mỗi bài: [tên gym, tên tại nhà, loại m/a, (để trống), số set x rep]
const TPL = {
  push: ['Ngực + vai + tay sau', [['Đẩy ngực ngang', 'Hít đất', 'm', '', '3x10'], ['Đẩy ngực dốc lên', 'Hít đất chân kê cao', 'm', '', '3x12'], ['Đẩy ngực tạ đơn ghế nằm', 'Hít đất tay rộng', 'm', '', '3x12'],
    ['Ép ngực (máy pec deck)', 'Ép ngực tạ đơn / chai nước', 'a', '', '3x12 + 3x8'], ['Kéo ngực với dây cáp', 'Hít đất tay hẹp', 'a', '', '4x12'], ['Chest press (máy)', 'Dips ghế', 'a', '', '3x8'],
    ['Bay vai', 'Bay vai tạ đơn', 'a', '', '4x12'], ['Kéo cáp tay sau', 'Tay sau tạ đơn qua đầu', 'a', '', '4x12'], ['Gập tạ đơn kiểu búa', 'Gập tạ đơn kiểu búa', 'a', '', '3x16/8'], ...ABS, CARDIO]],
  pull: ['Lưng + tay trước', [['Seated cable row', 'Row tạ đơn / ba lô', 'm', '', '4x12'], ['Lat pulldown', 'Kéo xà (nếu có xà)', 'm', '', '4x12'], ['Đẩy ngực dốc lên', 'Hít đất chân kê cao', 'a', '', '3x12'],
    ['EZ bar curl', 'Curl tạ đơn', 'a', '', '3x8'], ['T bar row', 'Row tạ đơn cúi sâu (thay T-bar)', 'm', '', '4x8'], ['Cuốn tạ búa ghế dốc', 'Cuốn tạ đơn ngồi dốc', 'a', '', '3x8'],
    ['Gập tạ đơn kiểu búa', 'Gập tạ đơn kiểu búa', 'a', '', '3x16/8'], ['Single arm row', 'Single arm row', 'm', '', '3x8'], ...ABS, CARDIO]],
  leg: ['Chân + mông', [['Squat', 'Goblet squat', 'm', '', '4x8-12'], ['Leg press', 'Lunge', 'm', '', '4x12'], ['Romanian deadlift', 'RDL tạ đơn', 'm', '', '3x10'], ['Gập đùi sau (máy)', 'Hip thrust', 'a', '', '3x12'],
    ['Bulgarian split squat', 'Bulgarian split squat', 'a', '', '3x10'], ['Calf raise', 'Calf raise', 'a', '', '4x15'], ABS[0], ABS[3], CARDIO]],
  up: ['Thân trên', [['Đẩy ngực ngang', 'Hít đất', 'm', '', '3x10'], ['Lat pulldown', 'Kéo xà (nếu có xà)', 'm', '', '4x12'], ['Đẩy vai tạ đơn', 'Pike push-up', 'm', '', '3x10'], ['Seated cable row', 'Row tạ đơn / ba lô', 'm', '', '3x12'],
    ['Bay vai', 'Bay vai tạ đơn', 'a', '', '3x12'], ['EZ bar curl', 'Curl tạ đơn', 'a', '', '3x10'], ['Kéo cáp tay sau', 'Tay sau tạ đơn qua đầu', 'a', '', '3x12'], ABS[0], ABS[1], CARDIO]],
  lo: ['Thân dưới', [['Squat', 'Goblet squat', 'm', '', '4x8-12'], ['Deadlift', 'RDL tạ đơn', 'm', '', '3x8'], ['Leg press', 'Lunge', 'm', '', '3x12'], ['Bulgarian split squat', 'Bulgarian split squat', 'a', '', '3x10'],
    ['Gập đùi sau (máy)', 'Hip thrust', 'a', '', '3x12'], ['Calf raise', 'Calf raise', 'a', '', '4x15'], ABS[3], ABS[2], CARDIO]],
  fa: ['Toàn thân A', [['Squat', 'Goblet squat', 'm', '', '3x8-12'], ['Đẩy ngực ngang', 'Hít đất', 'm', '', '3x8-12'], ['Seated cable row', 'Row tạ đơn / ba lô', 'm', '', '3x8-12'], ['Đẩy vai tạ đơn', 'Pike push-up', 'a', '', '3x10'],
    ['Plank 3x40s', 'Plank 3x40s', 'a', '', ''], ABS[0], CARDIO]],
  fb: ['Toàn thân B', [['Deadlift', 'RDL tạ đơn', 'm', '', '3x8-12'], ['Đẩy ngực dốc lên', 'Hít đất chân kê cao', 'm', '', '3x10'], ['Lat pulldown', 'Kéo xà (nếu có xà)', 'm', '', '3x8-12'], ['Lunge', 'Lunge', 'a', '', '3x10'],
    ['Bay vai', 'Bay vai tạ đơn', 'a', '', '3x12'], ['Calf raise', 'Calf raise', 'a', '', '3x15'], ABS[1], CARDIO]]
};
const SPLIT = { 3: [[0, 'fa'], [2, 'fb'], [4, 'fa']], 4: [[0, 'up'], [1, 'lo'], [3, 'up'], [4, 'lo']], 5: [[0, 'push'], [1, 'pull'], [2, 'leg'], [3, 'up'], [4, 'lo']], 6: [[0, 'push'], [1, 'pull'], [2, 'leg'], [3, 'push'], [4, 'pull'], [5, 'leg']] };
const RX = { gain: ['4x6-10', '3x10-12'], lean: ['3x8-12', '3x10-15'], cut: ['3x10-12', '3x12-15'], keep: ['3x8-12', '3x10-12'] };
T.plan = () => {
  const p = D.p, c = calc(p), wk = Math.floor((Date.now() - new Date(D.start)) / 6048e5) + 1, ph = (wk - 1) % 4 + 1, dl = ph == 4, tr = trend();
  let h = `<h2>Kế hoạch – Tuần ${wk}</h2><div class=card><div class=r2><div><div class=mut>Tiêu hao / ngày (TDEE)</div><div class=big>${Math.round(c.tdee)}</div></div>
  <div><div class=mut>Nên ăn / ngày (kcal)</div><div class=big style="color:var(--a)">${Math.round(c.t)}</div></div></div>
  <p class=mut>BMR ${Math.round(c.bmr)} · công việc ×${c.pal} · đạm ${Math.round(c.pro)}g · tinh bột ${Math.round(c.carb)}g · béo ${Math.round(c.fat)}g · nước ${c.water.toFixed(1)}L (+0,5L ngày tập)</p>
  ${c.note ? `<p class=warn>${c.note}</p>` : ''}${p.age < 18 ? '<p class=warn>Dưới 18 tuổi: không nên cắt calo, hãy hỏi huấn luyện viên hoặc bác sĩ.</p>' : ''}${p.injury ? `<p class=warn>Lưu ý chấn thương: ${p.injury}. Bỏ hoặc giảm bài gây đau.</p>` : ''}</div>`;
  h += `<div class=card><h3>${dl ? 'Tuần nhẹ (deload)' : 'Tuần tăng tiến ' + ph + '/3'}</h3><p class=mut style="margin:0">${dl ? 'Giảm 1 set mỗi bài, dùng khoảng 60% tạ để cơ phục hồi.' : 'Mỗi bài thêm 1 rep mỗi set hoặc tăng ~2,5% tạ so với tuần trước. Nghỉ 60–120 giây giữa set.'}</p></div>`;
  h += `<div class=card><h3>Ngân sách</h3><p class=mut style="margin:0">${BTIP[p.bud || 'mid']}</p></div>`;

  const c = $('#ch').getContext('2d'), mn = Math.min(...w.map(x => x.kg)) - 1, mx = Math.max(...w.map(x => x.kg)) + 1;

  w.forEach((x, i) => { const X = 20 + i * 560 / (w.length - 1), Y = 140 - (x.kg - mn) / (mx - mn) * 120; i ? c.lineTo(X, Y) : c.moveTo(X, Y); }); c.stroke();
  c.fillStyle = '#aaa'; c.font = '14px sans-serif'; c.fillText(mx.toFixed(1), 2, 14); c.fillText(mn.toFixed(1), 2, 158);
};
// ---------------- Đăng nhập (email + mật khẩu; trên web có thêm Google) ----------------
const isNative = () => !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const isStandalone = () => !!(navigator.standalone || (matchMedia && matchMedia('(display-mode: standalone)').matches));
const acctBar = () => DB && USER ? `<div class=card style="display:flex;gap:10px;align-items:center;justify-content:space-between"><div><div class=mut>Tài khoản</div><b>${USER.email}</b><div class=mut id=sync>${st8 || 'Đã đồng bộ'}</div></div><button class=g style="width:auto;margin:0" onclick="logout()">Đăng xuất</button></div>` : '';
const backupBar = () => `<div class=card><h3>Sao lưu dữ liệu</h3><div class=r2><button class=g onclick="exportData()">Sao chép bản sao lưu</button><button class=g onclick="importData()">Khôi phục từ bản sao lưu</button></div><textarea id=bk rows=3 placeholder="Dán bản sao lưu vào đây để khôi phục" style="width:100%;margin-top:8px"></textarea><p class=mut id=bkm style="margin:6px 0 0"></p></div>`;
async function exportData() {
  const t = JSON.stringify(D);
  try { await navigator.clipboard.writeText(t); $('#bkm').textContent = 'Đã sao chép. Hãy dán vào Ghi chú hoặc gửi cho chính mình để cất giữ.'; }
  catch (e) { $('#bk').value = t; $('#bk').select(); $('#bkm').textContent = 'Hãy sao chép đoạn văn bản trong ô rồi cất giữ.'; }
}
function importData() {
  try {
    const d = JSON.parse($('#bk').value.trim()); if (!d || typeof d != 'object' || !('p' in d)) throw 0;
    if (!confirm('Khôi phục sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?')) return;
    D = norm(d); save(); Object.keys(D.ref).forEach(saveRef); go('profile');
  } catch (e) { $('#bkm').textContent = 'Bản sao lưu không hợp lệ.'; }
}
function authUI(html) { let a = $('#auth'); if (!a) { a = document.createElement('div'); a.id = 'auth'; document.body.appendChild(a); } a.innerHTML = `<div class=box>${html}</div>`; }
function showLogin(msg = '') {
  stopCam(); closeDemo();
  authUI(`<h2>Đăng nhập Gym Coach</h2><div class=card><p class=mut style="margin:0 0 6px">Mỗi người một tài khoản riêng. Dữ liệu thể trạng, kế hoạch, nhật ký và rep mẫu chỉ mình bạn xem được và được giữ lại cho lần mở sau.</p>
  <label>Email (Gmail)</label><input id=em type=email autocomplete=email placeholder="ten@gmail.com" value="${LASTEM}">
  <label>Mật khẩu (từ 6 ký tự)</label><input id=pw type=password autocomplete=current-password>
  <button onclick="emailLogin(false)">Đăng nhập</button><button class=g onclick="emailLogin(true)">Tạo tài khoản mới</button><button class=g onclick="resetPw()">Quên mật khẩu</button>
  ${isNative() || isStandalone() ? '' : '<button class=g onclick="googleLogin()">Đăng nhập bằng Google</button>'}<p class=warn id=am>${msg}</p></div>`);
}
const authErr = e => ({ 'auth/invalid-credential': 'Sai email hoặc mật khẩu.', 'auth/wrong-password': 'Sai email hoặc mật khẩu.', 'auth/user-not-found': 'Email này chưa có tài khoản, hãy bấm Tạo tài khoản mới.',
  'auth/email-already-in-use': 'Email này đã có tài khoản, hãy bấm Đăng nhập.', 'auth/weak-password': 'Mật khẩu quá yếu, cần từ 6 ký tự.', 'auth/invalid-email': 'Email chưa đúng.',
  'auth/network-request-failed': 'Không có mạng, hãy thử lại khi có kết nối.', 'auth/too-many-requests': 'Thử quá nhiều lần, chờ một lúc rồi thử lại.',
  'auth/operation-not-allowed': 'Chưa bật phương thức đăng nhập này trong Firebase (Authentication, Sign-in method).', 'auth/popup-closed-by-user': 'Bạn đã đóng cửa sổ đăng nhập.',
  'auth/unauthorized-domain': 'Tên miền này chưa được cho phép trong Firebase (Authentication, Settings, Authorized domains).', 'auth/popup-blocked': 'Trình duyệt chặn cửa sổ đăng nhập, hãy cho phép rồi thử lại.' })[e.code] || 'Lỗi: ' + e.message;
async function emailLogin(create) {
  const em = $('#em').value.trim().toLowerCase(), pw = $('#pw').value, m = $('#am');
  if (!/^\S+@\S+\.\S+$/.test(em)) { m.textContent = 'Email chưa đúng.'; return; }
  if (pw.length < 6) { m.textContent = 'Mật khẩu cần từ 6 ký tự.'; return; }
  LASTEM = em; m.textContent = 'Đang xử lý…';
  try { create ? await AUTH.createUserWithEmailAndPassword(em, pw) : await AUTH.signInWithEmailAndPassword(em, pw); } // xong thì onAuthStateChanged xử lý tiếp
  catch (e) { m.textContent = authErr(e); }
}
async function resetPw() {
  const em = $('#em').value.trim().toLowerCase(), m = $('#am'); if (!/^\S+@\S+\.\S+$/.test(em)) { m.textContent = 'Nhập email trước rồi bấm Quên mật khẩu.'; return; }
  try { await AUTH.sendPasswordResetEmail(em); m.textContent = 'Đã gửi email đặt lại mật khẩu, kiểm tra cả mục Spam.'; } catch (e) { m.textContent = authErr(e); }
}
async function googleLogin() {
  const m = $('#am'); m.textContent = 'Đang mở cửa sổ đăng nhập…';
  try { await AUTH.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } catch (e) { m.textContent = authErr(e); }
}
async function afterLogin(u) {
  USER = u; KEY = 'gym_' + u.uid; authUI('<p class=mut style="text-align:center;margin-top:35vh">Đang tải dữ liệu của bạn…</p>');
  let loc = null; try { loc = JSON.parse(localStorage[KEY] || 'null'); } catch (e) {}
  let doc = null, err = false;
  try { doc = await uref().get(); } catch (e) { err = true; }
  canPush = !err;
  const cd = doc && doc.exists ? doc.data() : null, cloud = cd && cd.json ? { json: cd.json, ts: cd.updated_at || 0 } : null;
  const pk = pickData(cloud, loc, { dirty: localStorage[KEY + '_d'] == '1', lastSync: +localStorage[KEY + '_s'] || 0 });
  if (err) { D = norm(loc); st8 = 'Chưa kết nối được máy chủ, đang dùng bản lưu trên máy'; }
  else if (pk.src == 'cloud') {
    try { if (pk.conflict) localStorage[KEY + '_conflict'] = JSON.stringify(loc); D = norm(JSON.parse(cloud.json)); localStorage[KEY + '_s'] = cloud.ts; localStorage.removeItem(KEY + '_d'); }
    catch (e) { D = norm(loc); canPush = false; st8 = 'Dữ liệu trên máy chủ bị lỗi, chưa ghi đè'; }
  }
  else if (pk.src == 'local') D = norm(loc);
  else { // tài khoản mới: có thể chuyển dữ liệu cũ trên máy này sang
    let old = null; try { old = JSON.parse(localStorage.gym || 'null'); } catch (e) {}
    D = norm(old && old.p && confirm('Máy này có dữ liệu cũ chưa gắn tài khoản. Chuyển vào tài khoản ' + u.email + '?') ? old : loc);
  }
  if (canPush) { // rep mẫu lưu riêng theo từng người, từng bài
    try { const r = await uref().collection('ref').get(); if (!r.empty) { D.ref = {}; r.forEach(x => { const v = x.data(); D.ref[x.id] = { min: v.min, max: v.max }; }); } else Object.keys(D.ref).forEach(saveRef); } catch (e) {}
  }
  const cache = () => { try { localStorage[KEY] = JSON.stringify(D); } catch (e) {} };
  if (canPush && !(pk.src == 'cloud' && cloud)) { save(); push(); } else cache(); // chỉ ghi lên máy chủ khi dữ liệu trên máy là bản đúng
  const a = $('#auth'); if (a) a.remove();
  go(D.p ? 'plan' : 'profile');
}
async function saveRef(k) {
  if (!DB || !USER || !canPush || !D.ref[k]) return;
  try { await uref().collection('ref').doc(k).set({ min: D.ref[k].min, max: D.ref[k].max, updated_at: Date.now() }); sync('Đã lưu rep mẫu'); }
  catch (e) { sync('Chưa lưu được rep mẫu lên máy chủ'); }
}
async function delRef() {
  const k = $('#ex').value; if (!k || !D.ref[k]) return;
  if (!confirm('Xóa rep mẫu của bài này? App sẽ dùng chuẩn mặc định.')) return;
  delete D.ref[k]; save();
  if (DB && USER && canPush) { try { await uref().collection('ref').doc(k).delete(); } catch (e) {} }
  st = null; sm = null; info();
}
async function logout() {
  if (dirty && !confirm('Còn dữ liệu chưa đồng bộ, đăng xuất bây giờ có thể mất. Vẫn đăng xuất?')) return;
  try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '_d'); localStorage.removeItem(KEY + '_s'); } catch (e) {}
  USER = null; KEY = 'gym'; dirty = false; canPush = false; D = norm({});
  await AUTH.signOut(); showLogin();
}
function boot() {
  if (!FB_CONFIG || !window.firebase) { go(D.p ? 'plan' : 'profile'); return; } // chưa cấu hình: chạy chế độ lưu trên máy
  firebase.initializeApp(FB_CONFIG); AUTH = firebase.auth(); DB = firebase.firestore();
  let first = true;
  AUTH.onAuthStateChanged(u => {
    if (u) { if (!USER || USER.uid != u.uid) afterLogin(u); }
    else if (USER) { USER = null; KEY = 'gym'; D = norm({}); showLogin('Phiên đăng nhập đã hết, hãy đăng nhập lại.'); }
    else if (first) showLogin();
    first = false;
  });
}
if ('serviceWorker' in navigator && !isNative() && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script></body></html>

<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f12"><title>Gym Coach</title>
<style>
:root{--bg:#0d0f12;--c:#171a1f;--a:#3ddc97;--t:#eee;--m:#9aa3ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,sans-serif;padding-bottom:76px}
main{padding:14px;padding-top:calc(14px + env(safe-area-inset-top));max-width:640px;margin:auto}
h2{margin:0 0 10px;font-size:20px}h3{margin:0 0 6px;font-size:15px;color:var(--a)}
.card{background:var(--c);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
input,select,textarea,button{font:inherit;color:var(--t);background:#22262d;border:1px solid #333;border-radius:8px;padding:9px;width:100%}
button{background:var(--a);color:#000;font-weight:700;border:0;margin-top:6px}button.g{background:#22262d;color:var(--t);border:1px solid #444}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#12151a;border-top:1px solid #262a31;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--m);border-radius:0;padding:12px 2px;font-size:12px;margin:0;border:0}nav button.on{color:var(--a)}
.big{font-size:26px;font-weight:800}.mut{color:var(--m);font-size:13px}.warn{color:#ffd166;font-size:13px}
table{width:100%;border-collapse:collapse}td{padding:5px 2px;border-bottom:1px solid #262a31;vertical-align:top}
canvas{width:100%;border-radius:10px;background:#000}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9;overflow:auto;padding:14px}.mo .box{max-width:640px;margin:0 auto}
.dm{width:100%;height:260px;border-radius:12px;display:block;touch-action:none}.ex{cursor:pointer;border-bottom:1px dotted var(--a)}
</style></head><body>
<main id="v"></main>
<nav><button data-t="profile">Hồ sơ</button><button data-t="plan">Kế hoạch</button><button data-t="food">Ăn uống</button><button data-t="cam">Form AI</button><button data-t="log">Nhật ký</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = s => document.querySelector(s), V = $('#v');
let D = {}; try { D = JSON.parse(localStorage.gym || '{}'); } catch (e) {}
D.p = D.p || null; D.w = D.w || []; D.s = D.s || []; D.c = D.c || []; D.adj = D.adj || 0; D.ref = D.ref || {};
const save = () => { try { localStorage.gym = JSON.stringify(D); } catch (e) {} };
const today = () => new Date().toISOString().slice(0, 10);
// Hệ số vận động NGOÀI giờ tập theo công việc (đã tách riêng buổi tập)
const JOBS = [['Văn phòng / kế toán / lập trình (ngồi nhiều)', 1.30], ['Sinh viên (học, ít di chuyển)', 1.35], ['Tài xế (ngồi lái)', 1.35],
  ['Giáo viên / giảng viên (đứng, đi lại vừa)', 1.45], ['Bán hàng / phục vụ (đứng nhiều)', 1.55], ['Y tá / đầu bếp / chăm sóc', 1.55],
  ['Shipper / giao hàng', 1.60], ['Công nhân nhà máy / thợ', 1.65], ['Lao động nặng (xây dựng, bốc vác, nông nghiệp)', 1.80], ['Học sinh (đi học, ít vận động)', 1.40]];
const GOALS = { gain: 'Tăng cơ', lean: 'Săn chắc (giảm mỡ, giữ/tăng cơ)', cut: 'Giảm mỡ', keep: 'Giữ cân' };

function calc(p) {
  const bmr = p.fat ? 370 + 21.6 * p.w * (1 - p.fat / 100) : 10 * p.w + 6.25 * p.h - 5 * p.age + (p.sex == 'm' ? 5 : -161);
  const pal = JOBS[p.job][1], tdee = bmr * pal + p.n * 4.5 * p.w / 7; // buổi tập ≈ MET 4.5 × 1 giờ
  let f = { gain: 1.1, lean: .95, cut: .82, keep: 1 }[p.goal], note = '';
  if (p.age < 18 && f < 1) f = 1;
  let t = tdee * f + D.adj;
  const fl = Math.max(p.sex == 'm' ? 1500 : 1200, bmr * .9);
  if (t < fl) { t = fl; note = 'Đã nâng lên mức calo tối thiểu an toàn.'; }
  if (p.goal == 'gain' && t > tdee + 500) t = tdee + 500;
  const pro = p.w * { gain: 1.8, lean: 2, cut: 2.2, keep: 1.6 }[p.goal], fat = p.w * .9;
  return { bmr, pal, tdee, t, pro, fat, carb: Math.max(0, (t - pro * 4 - fat * 9) / 4), water: p.w * .035 + .5, note };
}
function trend() {
  const a = D.w.filter(x => x.d >= (D.adjAt || '') && Date.now() - new Date(x.d) < 21 * 864e5);
  if (a.length < 2) return null;
  const f = a[0], l = a[a.length - 1], days = (new Date(l.d) - new Date(f.d)) / 864e5;
  if (days < 6) return null;
  const r = (l.kg - f.kg) / f.kg * 100 / (days / 7), g = D.p.goal; let d = 0;
  if (g == 'cut') d = r > -.3 ? -100 : r < -1 ? 150 : 0;
  else if (g == 'gain') d = r < .1 ? 150 : r > .6 ? -100 : 0;
  else if (g == 'lean') d = r > .15 ? -100 : r < -.5 ? 100 : 0;
  else d = r > .3 ? -100 : r < -.3 ? 100 : 0;
  return { r, d };
}
function go(t) {
  stopCam(); closeDemo(); clearInterval(tm);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t == t));
  if (!D.p && t != 'profile') t = 'profile';
  T[t](); window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.t));

// ---------------- Hồ sơ ----------------
const T = {};
T.profile = () => {
  const p = Object.assign({ bud: 'mid', cap: '' }, D.p || { sex: 'm', age: 21, h: 170, w: 65, fat: '', job: 0, n: 4, exp: 0, eq: 'gym', goal: 'lean', allergy: '', injury: '', time: '18:00' });
  V.innerHTML = `<h2>Hồ sơ của bạn</h2><div class=card>
  <div class=r2><div><label>Giới tính</label><select id=sex><option value=m>Nam<option value=f>Nữ</select></div>
  <div><label>Tuổi</label><input id=age type=number></div>
  <div><label>Chiều cao (cm)</label><input id=h type=number></div><div><label>Cân nặng (kg)</label><input id=w type=number step=.1></div></div>
  <label>% mỡ cơ thể (không bắt buộc, giúp tính chính xác hơn)</label><input id=fat type=number>
  <label>Công việc (ước lượng vận động ngoài giờ tập)</label><select id=job>${JOBS.map((j, i) => `<option value=${i}>${j[0]}`).join('')}</select>
  <label>Mục tiêu</label><select id=goal>${Object.entries(GOALS).map(([k, v]) => `<option value=${k}>${v}`).join('')}</select>
  <div class=r2><div><label>Số buổi tập / tuần</label><select id=n><option>3<option>4<option>5<option>6</select></div>
  <div><label>Kinh nghiệm</label><select id=exp><option value=0>Mới tập<option value=1>Trung bình<option value=2>Lâu năm</select></div>
  <div><label>Nơi tập</label><select id=eq><option value=gym>Phòng gym<option value=home>Tại nhà</select></div>
  <div><label>Giờ tập thường ngày</label><input id=time type=time></div></div>
  <label>Ngân sách đầu tư cho tập luyện và ăn uống</label><select id=bud><option value=sv>Học sinh / sinh viên (tiết kiệm)<option value=mid>Cơ bản (cân bằng)<option value=inv>Đầu tư nghiêm túc (người đi làm, chi nhiều hơn)</select>
  <label>Ngân sách ăn uống mỗi ngày (nghìn đồng, tùy chọn)</label><input id=cap type=number placeholder="vd: 60">
  <label>Dị ứng / món không ăn (cách nhau bằng dấu phẩy)</label><input id=allergy placeholder="vd: tôm, đậu phộng, sữa">
  <label>Chấn thương / vấn đề sức khỏe</label><input id=injury placeholder="vd: đau gối phải">
  <button onclick="saveP()">Lưu và tạo kế hoạch</button></div>
  <p class=mut>Ứng dụng chỉ mang tính hỗ trợ, không thay thế huấn luyện viên hoặc bác sĩ. Nếu có chấn thương hay bệnh lý, hãy hỏi chuyên gia trước khi tập. Video camera chỉ xử lý trên máy bạn, không gửi đi đâu.</p>`;
  Object.keys(p).forEach(k => { const e = $('#' + k); if (e) e.value = p[k] || (k == 'job' || k == 'exp' ? 0 : ''); });
};
function saveP() {
  const g = i => $('#' + i).value;
  const p = { sex: g('sex'), age: +g('age'), h: +g('h'), w: +g('w'), fat: +g('fat') || 0, job: +g('job'), n: +g('n'), exp: +g('exp'), eq: g('eq'), goal: g('goal'), allergy: g('allergy'), injury: g('injury'), time: g('time') || '18:00', bud: g('bud') || 'mid', cap: +g('cap') || 0 };
  if (!(p.age >= 14 && p.age <= 80 && p.h >= 120 && p.h <= 230 && p.w >= 35 && p.w <= 200)) { alert('Kiểm tra lại tuổi, chiều cao, cân nặng.'); return; }
  D.p = p; if (!D.start) D.start = today(); if (!D.w.length) D.w.push({ d: today(), kg: p.w }); save(); go('plan');
}

// ---------------- Kế hoạch tập ----------------
const TPL = {
  push: ['Push (ngực – vai – tay sau)', [['Bench press', 'Hít đất', 'm', 'pushup'], ['Đẩy vai tạ đơn', 'Pike push-up', 'm', 'press'], ['Incline dumbbell press', 'Hít đất tay hẹp', 'a', 'pushup'], ['Tay sau cáp (pushdown)', 'Dips ghế', 'a']]],
  pull: ['Pull (lưng – tay trước)', [['Lat pulldown', 'Row tạ đơn / ba lô', 'm'], ['Barbell row', 'Row tạ đơn 1 tay', 'm'], ['Face pull', 'Reverse fly tạ đơn', 'a'], ['Curl tạ đòn', 'Curl tạ đơn', 'a']]],
  leg: ['Legs (chân – mông)', [['Squat', 'Goblet squat', 'm', 'squat'], ['Romanian deadlift', 'RDL tạ đơn', 'm', 'dead'], ['Leg press', 'Lunge', 'a'], ['Gập đùi sau', 'Hip thrust', 'a'], ['Calf raise', 'Calf raise', 'a']]],
  up: ['Upper (thân trên)', [['Bench press', 'Hít đất', 'm', 'pushup'], ['Lat pulldown', 'Row tạ đơn', 'm'], ['Đẩy vai tạ đơn', 'Pike push-up', 'a', 'press'], ['Curl + tay sau', 'Curl + dips ghế', 'a']]],
  lo: ['Lower (thân dưới)', [['Squat', 'Goblet squat', 'm', 'squat'], ['Deadlift', 'RDL tạ đơn', 'm', 'dead'], ['Bulgarian split squat', 'Bulgarian split squat', 'a'], ['Calf raise', 'Calf raise', 'a']]],
  fa: ['Toàn thân A', [['Squat', 'Goblet squat', 'm', 'squat'], ['Bench press', 'Hít đất', 'm', 'pushup'], ['Row tạ đòn', 'Row tạ đơn', 'm'], ['Plank 3x40s', 'Plank 3x40s', 'a']]],
  fb: ['Toàn thân B', [['Deadlift', 'RDL tạ đơn', 'm', 'dead'], ['Đẩy vai', 'Pike push-up', 'm', 'press'], ['Lat pulldown', 'Row tạ đơn', 'm'], ['Lunge', 'Lunge', 'a']]]
};
const SPLIT = { 3: [[0, 'fa'], [2, 'fb'], [4, 'fa']], 4: [[0, 'up'], [1, 'lo'], [3, 'up'], [4, 'lo']], 5: [[0, 'push'], [1, 'pull'], [2, 'leg'], [3, 'up'], [4, 'lo']], 6: [[0, 'push'], [1, 'pull'], [2, 'leg'], [3, 'push'], [4, 'pull'], [5, 'leg']] };
const RX = { gain: ['4x6-10', '3x10-12'], lean: ['3x8-12', '3x10-15'], cut: ['3x10-12', '3x12-15'], keep: ['3x8-12', '3x10-12'] };
T.plan = () => {
  const p = D.p, c = calc(p), wk = Math.floor((Date.now() - new Date(D.start)) / 6048e5) + 1, ph = (wk - 1) % 4 + 1, dl = ph == 4, tr = trend();
  let h = `<h2>Kế hoạch – Tuần ${wk}</h2><div class=card><div class=r2><div><div class=mut>Tiêu hao / ngày (TDEE)</div><div class=big>${Math.round(c.tdee)}</div></div>
  <div><div class=mut>Nên ăn / ngày (kcal)</div><div class=big style="color:var(--a)">${Math.round(c.t)}</div></div></div>
  <p class=mut>BMR ${Math.round(c.bmr)} · công việc ×${c.pal} · đạm ${Math.round(c.pro)}g · tinh bột ${Math.round(c.carb)}g · béo ${Math.round(c.fat)}g · nước ${c.water.toFixed(1)}L (+0,5L ngày tập)</p>
  ${c.note ? `<p class=warn>${c.note}</p>` : ''}${p.age < 18 ? '<p class=warn>Dưới 18 tuổi: không nên cắt calo, hãy hỏi huấn luyện viên hoặc bác sĩ.</p>' : ''}${p.injury ? `<p class=warn>Lưu ý chấn thương: ${p.injury}. Bỏ hoặc giảm bài gây đau.</p>` : ''}</div>`;
  h += `<div class=card><h3>${dl ? 'Tuần nhẹ (deload)' : 'Tuần tăng tiến ' + ph + '/3'}</h3><p class=mut style="margin:0">${dl ? 'Giảm 1 set mỗi bài, dùng khoảng 60% tạ để cơ phục hồi.' : 'Mỗi bài thêm 1 rep mỗi set hoặc tăng ~2,5% tạ so với tuần trước. Nghỉ 60–120 giây giữa set.'}</p></div>`;
  h += `<div class=card><h3>Ngân sách</h3><p class=mut style="margin:0">${BTIP[p.bud || 'mid']}</p></div>`;
  if (tr) h += `<div class=card><h3>Theo dõi cân nặng</h3><p style="margin:0">Cân nặng đang đổi ${tr.r > 0 ? '+' : ''}${tr.r.toFixed(2)}%/tuần. ${tr.d ? `Đề xuất ${tr.d > 0 ? 'tăng' : 'giảm'} ${Math.abs(tr.d)} kcal/ngày.</p><button onclick="D.adj=Math.max(-400,Math.min(400,D.adj+(${tr.d})));D.adjAt=today();save();T.plan()">Áp dụng</button>` : 'Đang đúng hướng, giữ nguyên.</p>'}</div>`;
  const sess = weekSess(p, wk), tdi = (new Date().getDay() + 6) % 7;
  ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].forEach((nm, i) => {
    const k = sess[i];
    if (!k) { h += `<div class=card><h3>${nm} · Nghỉ</h3><span class=mut>Đi bộ nhẹ 30 phút, giãn cơ, ngủ đủ 7–9 tiếng.</span></div>`; return; }
    const [title, ex] = TPL[k];
    h += `<div class=card${i == tdi ? ' style="outline:1px solid var(--a)"' : ''}><h3>${nm}${i == tdi ? ' (hôm nay)' : ''} · ${title}</h3><table>${ex.slice(0, p.exp == 0 ? 3 : 9).map(e => {
      const r = e[0].startsWith('Plank') ? '' : RX[p.goal][e[2] == 'm' ? 0 : 1].replace(/^\d/, x => dl ? x - 1 : x) + (dl ? ' nhẹ' : '');
      return `<tr><td><span class=ex onclick="demo(this.textContent)">${en(e)}</span>${camOf(en(e)) ? ' 📷' : ''}</td><td align=right>${r}</td></tr>`;
    }).join('')}</table><span class=mut>Khởi động 5–8 phút + 2 set nhẹ bài đầu.${p.goal == 'cut' || p.goal == 'lean' ? ' Cardio nhẹ 15–20 phút sau tập.' : ''}</span></div>`;
  });
  V.innerHTML = h + `<p class=mut>Bấm tên bài để xem minh họa 3D. 📷 = bài kiểm tra form bằng camera ở tab "Form AI" (theo đúng buổi tập).</p><button class=g onclick="if(confirm('Bắt đầu chu kỳ mới từ tuần 1?')){D.start=today();save();T.plan()}">Bắt đầu chu kỳ mới</button>
  <button class=g onclick="T.profile()">Sửa hồ sơ</button>`;
};

// ---------------- Ăn uống ----------------
const F = { // kcal, đạm, tinh bột, béo / 100g
  'Cơm trắng': [130, 2.7, 28, .3], 'Khoai lang luộc': [86, 1.6, 20, .1], 'Yến mạch (khô)': [380, 13, 66, 7], 'Bánh mì': [265, 9, 49, 3.2], 'Chuối': [89, 1.1, 23, .3],
  'Ức gà luộc': [165, 31, 0, 3.6], 'Thịt bò nạc': [180, 26, 0, 8], 'Cá thu / cá basa': [160, 19, 0, 9], 'Trứng gà': [143, 12.6, .7, 9.5], 'Đậu hũ': [76, 8, 2, 4.8],
  'Sữa chua Hy Lạp': [59, 10, 3.6, .4], 'Rau xanh luộc': [25, 2, 4, .3], 'Hạt / đậu phộng': [580, 25, 16, 48], 'Cá hồi': [208, 20, 0, 13], 'Whey protein': [400, 80, 8, 6]
};
T.food = () => {
  const p = D.p, c = calc(p), [hr, mn] = p.time.split(':').map(Number), tt = hr + mn / 60;
  const bn = p.allergy.toLowerCase().split(/[,;]/).map(s => s.trim()).filter(Boolean), ok = n => !bn.some(b => n.toLowerCase().includes(b)), bd = p.bud || 'mid', NO = ({ sv: PREM, mid: ['Whey protein', 'Cá hồi'], inv: [] })[bd], pick = (l, pr) => { l = l.filter(n => !NO.includes(n)); if (pr && bd == 'sv') l.sort((a, b) => PRICE[a] / F[a][1] - PRICE[b] / F[b][1]); if (pr && bd == 'inv') l.sort((a, b) => PREM.includes(b) - PREM.includes(a)); return l.find(ok); };
  const hh = x => { x = (x % 24 + 24) % 24; return String(Math.floor(x)).padStart(2, '0') + ':' + String(Math.floor(x % 1 * 60)).padStart(2, '0'); };
  const M = [['Sáng', 7, .22, ['Trứng gà', 'Sữa chua Hy Lạp', 'Đậu hũ'], ['Yến mạch (khô)', 'Bánh mì', 'Chuối']],
    ['Trưa', 12, .28, ['Ức gà luộc', 'Thịt bò nạc', 'Cá hồi', 'Cá thu / cá basa', 'Đậu hũ'], ['Cơm trắng', 'Khoai lang luộc'], 1],
    ['Trước tập (1–2 giờ trước, ít béo, dễ tiêu)', tt - 1.5, .15, ['Sữa chua Hy Lạp', 'Trứng gà'], ['Chuối', 'Bánh mì', 'Khoai lang luộc']],
    ['Sau tập (trong 1–2 giờ: đạm + tinh bột)', tt + 1, .25, ['Whey protein', 'Ức gà luộc', 'Cá hồi', 'Cá thu / cá basa', 'Thịt bò nạc', 'Đậu hũ'], ['Cơm trắng', 'Khoai lang luộc'], 1],
    ['Phụ trước ngủ', 22, .10, ['Sữa chua Hy Lạp', 'Trứng gà'], ['Hạt / đậu phộng']]].sort((a, b) => (a[1] + 24) % 24 - (b[1] + 24) % 24);
  const tot = [0, 0, 0, 0]; let cost = 0;
  const rows = M.map(m => {
    const it = []; let k = 0;
    const add = (n, g) => { const f = F[n]; cost += PRICE[n] * g / 100; k += f[0] * g / 100; [0, 1, 2, 3].forEach(i => tot[i] += f[i] * g / 100); it.push(n == 'Trứng gà' ? `${g / 50} quả trứng` : `${n} ${g}g`); };
    const pf = pick(m[3], 1), cf = pick(m[4]);
    if (pf) { let g = m[2] * c.pro / (F[pf][1] / 100); g = pf == 'Trứng gà' ? Math.max(1, Math.min(3, Math.round(g / 50))) * 50 : Math.round(Math.min(g, 400) / 5) * 5; add(pf, g); }
    if (m[5]) add('Rau xanh luộc', 100);
    if (cf) { let g = (m[2] * c.t - k) / (F[cf][0] / 100); g = Math.round(Math.max(0, Math.min(g, cf == 'Hạt / đậu phộng' ? 30 : 500)) / 5) * 5; if (g) add(cf, g); }
    return `<div class=card><h3>${hh(m[1])} · ${m[0]}</h3>${it.length ? it.join('<br>') : '<span class=mut>Tự chọn món phù hợp với dị ứng của bạn.</span>'}</div>`;
  }).join('');
  V.innerHTML = `<h2>Thực đơn 1 ngày</h2><div class=card>Mục tiêu: <b>${Math.round(c.t)} kcal</b> · đạm ${Math.round(c.pro)}g<br>
  Thực đơn dưới đây ≈ <b>${Math.round(tot[0])} kcal</b> · đạm ${Math.round(tot[1])}g · tinh bột ${Math.round(tot[2])}g · béo ${Math.round(tot[3])}g<br>
  Chi phí ước tính ≈ <b>${Math.round(cost)}k đ/ngày</b> (≈ ${(cost * 30 / 1000).toFixed(1)} triệu/tháng)${p.cap && cost > p.cap ? `<br><span class=warn>Vượt ngân sách ${p.cap}k/ngày. Chọn mức "Học sinh / sinh viên" trong hồ sơ để có thực đơn rẻ hơn.</span>` : ''}<br>

const pose = (A, B, k) => { const o = {}; ['t', 'th', 'sh', 'ua', 'fa', 'ah', 'th2', 'sh2'].forEach(f => { const g = q => q[f] ?? (f == 'ah' ? .08 : f == 'th2' ? q.th : f == 'sh2' ? q.sh : 0); o[f] = g(A) + (g(B) - g(A)) * k; }); return o; };
function joints(q) {
  const v = (a, l) => { a *= Math.PI / 180; return [Math.sin(a) * l, -Math.cos(a) * l]; }, ad = (a, b) => [a[0] + b[0], a[1] + b[1]], sb = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const an = [0, q.ah], kn = sb(an, v(q.sh, L.l)), hip = sb(kn, v(q.th, L.u)), kf = ad(hip, v(q.th2, L.u)), af = ad(kf, v(q.sh2, L.l)), sho = ad(hip, v(q.t, L.t)), el = ad(sho, v(q.ua, L.a));
  return { an, kn, hip, kf, af, sho, el, hd: ad(el, v(q.fa, L.f)), head: ad(sho, v(q.t, .2)) };
}
let DM = null;
function stopDemo() { if (DM) { DM.stop(); DM = null; } }
function closeDemo() { stopDemo(); document.querySelectorAll('.mo').forEach(e => e.remove()); }
function demo(name) {
  const a = animOf(name); if (!a) return; closeDemo();
  const o = document.createElement('div'); o.className = 'mo';
  o.innerHTML = `<div class=box><h2>${name}</h2><div id=dmw></div><p class=mut>${ANIM[a].cue}</p><p class=mut>Kéo ngón tay để xoay góc nhìn. Đây là mô hình minh họa, không phải video thật.</p><button onclick="closeDemo()">Đóng</button></div>`;
  o.onclick = e => { if (e.target == o) closeDemo(); }; document.body.appendChild(o); mount($('#dmw'), a);
}
function mount(box, key) {
  stopDemo(); if (!window.THREE) { box.textContent = 'Không tải được thư viện 3D (cần mạng).'; return; }
  const A = ANIM[key], W = box.clientWidth || 320, H = 260, R = new THREE.WebGLRenderer({ antialias: true }), V3 = THREE.Vector3;
  R.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); R.setSize(W, H); R.setClearColor(0x111418); R.domElement.className = 'dm'; box.innerHTML = ''; box.appendChild(R.domElement);
  const S = new THREE.Scene(), C = new THREE.PerspectiveCamera(40, W / H, .1, 50);
  S.add(new THREE.AmbientLight(0xffffff, .75)); const dl = new THREE.DirectionalLight(0xffffff, .7); dl.position.set(2, 4, 3); S.add(dl);
  const cy = new THREE.CylinderGeometry(1, 1, 1, 14), add = (g, c) => { const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: c })); S.add(m); return m; };
  const fl = add(new THREE.CircleGeometry(1.7, 48), 0x1d2229); fl.rotation.x = -Math.PI / 2; fl.position.x = A.cx;
  const NC = 0x3ddc97, FC = 0x2a9d6e, DEF = [['hip', 0, 'sho', 0, .12, NC], ['hip', .1, 'kn', .1, .075, NC], ['kn', .1, 'an', .1, .06, NC], ['hip', -.1, 'kf', -.1, .075, FC], ['kf', -.1, 'af', -.1, .06, FC],
    ['sho', .2, 'el', .2, .05, NC], ['el', .2, 'hd', .2, .045, NC], ['sho', -.2, 'el', -.2, .05, FC], ['el', -.2, 'hd', -.2, .045, FC], ['hip', -.1, 'hip', .1, .075, NC], ['sho', -.2, 'sho', .2, .06, NC]];
  const limbs = DEF.map(d => add(cy, d[5])), head = add(new THREE.SphereGeometry(.11, 16, 12), 0xeeeeee);
  const eq = A.eq == 'b' ? [add(cy, 0xaaaaaa), add(cy, 0x777777), add(cy, 0x777777)] : A.eq == 'd' ? [add(cy, 0xaaaaaa), add(cy, 0xaaaaaa)] : [];
  if (A.bn) { const b = add(new THREE.BoxGeometry(1, 1, 1), 0x39424d); b.scale.set(A.bn[2], .1, .4); b.position.set(A.bn[0], A.bn[1] - .05, 0); }
  const seg = (m, a, b, r) => { const d = new V3().subVectors(b, a), l = d.length() || 1e-3; m.position.copy(a).addScaledVector(d, .5); m.scale.set(r, l, r); m.quaternion.setFromUnitVectors(new V3(0, 1, 0), d.divideScalar(l)); };

    const t = (performance.now() - t0) / 1000, two = A.P.length > 1, J = joints(pose(A.P[0], A.P[two ? 1 : 0], two ? .5 - .5 * Math.cos(t * 1.6) : 0));

    if (A.eq == 'd') eq.forEach((m, i) => { m.rotation.x = Math.PI / 2; m.scale.set(.05, .2, .05); m.position.set(J.hd[0], J.hd[1], i ? -.2 : .2); });
    if (A.eq == 'b') { eq.forEach(m => m.rotation.x = Math.PI / 2); eq[0].scale.set(.022, 1.1, .022); eq[0].position.set(J.hd[0], J.hd[1], 0); [1, 2].forEach(i => { eq[i].scale.set(.13, .04, .13); eq[i].position.set(J.hd[0], J.hd[1], i == 1 ? .5 : -.5); }); }

}

// ---------------- Nhật ký ----------------
let tm;
const beep = () => { try { const a = new AudioContext(), o = a.createOscillator(); o.connect(a.destination); o.start(); setTimeout(() => { o.stop(); a.close(); }, 400); navigator.vibrate && navigator.vibrate(300); } catch (e) {} };
function rest(s) { clearInterval(tm); let t = s; const el = $('#tm'); tm = setInterval(() => { el.textContent = t > 0 ? `Nghỉ: ${t--}s` : (clearInterval(tm), beep(), 'Hết giờ nghỉ!'); }, 1000); }
function addW() { const kg = +$('#kg').value; if (!kg) return; D.w.push({ d: today(), kg, wa: +$('#wa').value || 0 }); D.w.sort((a, b) => a.d < b.d ? -1 : 1); D.p.w = kg; save(); T.log(); }
function addS() { const kg = +$('#sk').value, r = +$('#sr').value, ex = $('#se').value.trim(); if (!ex || !r) return; D.s.push({ d: today(), ex, kg, r }); save(); T.log(); }
T.log = () => {
  const ts = D.s.filter(x => x.d == today()), ws = D.w.slice(-5).reverse();
  V.innerHTML = `<h2>Nhật ký</h2><div class=card><h3>Cân nặng</h3><canvas id=ch width=600 height=160></canvas>

  <div class=card><h3>Set hôm nay</h3><div class=r3><input id=se placeholder="Bài tập" list=el><input id=sk type=number step=.5 placeholder="Tạ (kg)"><input id=sr type=number placeholder="Số rep"></div>
  <datalist id=el>${[...new Set(Object.values(TPL).flatMap(t => t[1].map(e => D.p.eq == 'gym' ? e[0] : e[1])))].map(x => `<option>${x}`).join('')}</datalist>
  <button onclick="addS()">Thêm set</button><table>${ts.map(x => `<tr><td>${x.ex}</td><td>${x.kg} kg × ${x.r}</td></tr>`).join('')}</table>
  <div class=r3><button class=g onclick="rest(60)">Nghỉ 60s</button><button class=g onclick="rest(90)">Nghỉ 90s</button><button class=g onclick="rest(120)">Nghỉ 120s</button></div><p class=big id=tm style="margin:8px 0 0"></p></div>
  <div class=card><h3>Buổi kiểm tra form gần đây</h3><table>${D.c.slice(-5).reverse().map(x => `<tr><td>${x.d}</td><td>${CAM[x.ex].n}</td><td>${x.n} rep · ${x.avg}đ</td></tr>`).join('') || '<tr><td class=mut>Chưa có.</td></tr>'}</table></div>`;
  const w = D.w.slice(-30); if (w.length < 2) return;
  const c = $('#ch').getContext('2d'), mn = Math.min(...w.map(x => x.kg)) - 1, mx = Math.max(...w.map(x => x.kg)) + 1;
